name: PR27 Final Hardening

on:
  push:
    branches:
      - feat/lineage-membership-profile-v0-1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/lineage-membership-profile-v0-1
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Apply deterministic final hardening
        run: python .github/pr27_finalize.py

      - name: Validate complete repository
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python -m pytest -q
          python scripts/verify_portable_causality.py \
            examples/causal-portability/fork-reconciliation.json
          python scripts/verify_lineage_compaction.py
          python scripts/verify_lineage_membership.py

      - name: Commit hardened result and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr27-final-hardening.yml .github/pr27_finalize.py
          git add ttrace/lineage_membership.py ttrace/__init__.py \
            tests/test_lineage_membership.py \
            scripts/verify_lineage_membership.py \
            spec/lineage-membership-profile-v0.1.md
          git commit -m "fix(protocol): finalize lineage membership accounting"
          git push origin HEAD:feat/lineage-membership-profile-v0-1
