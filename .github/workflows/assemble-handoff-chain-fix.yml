name: Assemble Handoff Chain Audit Fix

on:
  push:
    branches:
      - feat/repeated-witness-policy-handoff-chain-v0-1-ready
    paths:
      - .handoff-chain-fix-upload/**
      - .github/workflows/assemble-handoff-chain-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact fix payload
        run: |
          set -euo pipefail
          if [ ! -f .handoff-chain-fix-upload/part-000 ]; then
            echo "handoff_chain_fix=ALREADY_ASSEMBLED"
            exit 0
          fi
          cat .handoff-chain-fix-upload/part-* > /tmp/fix.b64
          base64 --decode /tmp/fix.b64 > /tmp/fix.tar.gz
          echo "d1d3350dd3122cba26606840e64a0b53a101debd6daa2e4af0f34af2ef26bd78  /tmp/fix.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/fix.tar.gz -C .
          python -m py_compile \
            ttrace/lineage_witness_handoff_chain.py \
            tests/test_lineage_witness_handoff_chain.py
          rm -rf .handoff-chain-fix-upload

      - name: Commit audit fix
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "handoff_chain_fix_commit=NO_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(protocol): require integer handoff-chain epochs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
