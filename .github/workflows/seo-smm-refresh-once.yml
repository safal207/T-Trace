name: Refresh T-Trace SEO and SMM layer

on:
  push:
    branches: [main]
    paths:
      - .github/seo-smm-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve discovery, first-screen clarity, and share assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          marker = "<!-- seo-product-intro:start -->"
          review_heading = "## Review links"

          if marker not in text:
              review_index = text.find(review_heading)
              if review_index == -1:
                  raise SystemExit(f"Missing heading: {review_heading}")

              badges_start = text.find("[![CI]")
              badges_end = text.find("\n\n", badges_start)
              if badges_start == -1 or badges_end == -1:
                  raise SystemExit("Could not locate badge block")
              badges = text[badges_start:badges_end]

              intro = dedent(r'''
              <!-- seo-product-intro:start -->
              # T-Trace — AI Agent Verification, Action Receipts & Deterministic Replay

              {badges}

              **An open JSONL protocol and executable benchmark for AI-agent action receipts, causal state transitions, deterministic replay, and assurance-boundary verification.**

              T-Trace helps teams distinguish four claims that are often collapsed into one:

              ```text
              presented trace is structurally valid
                             ≠
              evidence is fresh and action-bound
                             ≠
              every real-world effect was captured
                             ≠
              the claimed outcome was independently reproduced
              ```

              Use T-Trace/OpenPoC to test stale or replayed evidence, selective omission, recorder bypass, causal ordering, signed receipt interoperability, and unsupported success claims.

              ## Why T-Trace exists

              Event logs answer **what was recorded**. T-Trace adds machine-checkable transition semantics and an explicit assurance layer for asking **what the records actually prove**.

              | Need | T-Trace/OpenPoC provides |
              |---|---|
              | AI-agent verification | Executable negative fixtures for stale, replayed, incomplete, or bypassed evidence |
              | Action receipts | Signed-receipt verification and raw-octet hash-chain interoperability |
              | Deterministic replay | Strict record envelopes, causal transition/commit rules, and portable profiles |
              | Audit-trail boundaries | Separate verdicts for trace validity, capture completeness, effect binding, and overall assurance |
              | Independent evidence | A second verifier that matched **13/13** public Governex conformance vectors without importing the reference verifier |

              **Start here:** [OpenPoC-01 selective omission](docs/openpoc-01-selective-omission.md) · [Governex compatibility report](docs/governex-action-receipts-compatibility.md) · [Protocol specification](spec/t-trace.md)
              <!-- seo-product-intro:end -->
              ''').format(badges=badges).strip()

              text = intro + "\n\n" + text[review_index:]
              readme.write_text(text, encoding="utf-8")

          docs = Path("docs")
          docs.mkdir(exist_ok=True)
          social = dedent(r'''
          # T-Trace / OpenPoC Social & Distribution Kit

          ## Canonical one-liner

          > T-Trace is an open protocol and executable benchmark for AI-agent action receipts, deterministic replay, causal trace validation, and assurance-boundary verification.

          ## Search intent

          Primary: AI agent verification, action receipts, deterministic replay, AI agent audit trail, state transition protocol.

          Secondary: evidence completeness, selective omission, capture completeness, signed action receipts, causal trace validation, agent result verification, interoperability testing.

          ## Short share copy

          ### LinkedIn

          A valid AI-agent trace is not automatically proof of complete execution.

          T-Trace/OpenPoC separates structural trace validity from capture completeness, effect binding, freshness, and independent outcome reproduction.

          One executable fixture demonstrates the uncomfortable boundary: a real effect bypasses the recorder while the shorter presented trace still validates correctly.

          Repository: https://github.com/safal207/T-Trace

          ### X

          Valid trace ≠ complete execution proof.

          T-Trace/OpenPoC tests action receipts, deterministic replay, selective omission, recorder bypass, causal ordering, and unsupported success claims.

          13/13 independent receipt-vector agreement.

          https://github.com/safal207/T-Trace

          ### Telegram / Russian

          T-Trace/OpenPoC разделяет четыре разные вещи: корректность предъявленного trace, свежесть доказательств, полноту захвата реальных действий и независимое подтверждение результата. Главный тест показывает: реальный эффект может обойти recorder, а сокращённый trace всё равно честно пройти структурную проверку.

          ## Reusable post formula

          ```text
          Claim → presented evidence → verifier result → real-world boundary → explicit non-claim → reproducible fixture
          ```

          ## Recommended GitHub metadata

          Description:

          > AI-agent action receipts, deterministic replay, causal trace validation, and executable assurance-boundary tests.

          Topics:

          `ai-agent-verification`, `ai-safety`, `action-receipts`, `audit-trail`, `deterministic-replay`, `causal-tracing`, `agent-security`, `jsonl`, `protocol`, `interoperability`, `provenance`, `open-source`
          ''').strip() + "\n"
          (docs / "SOCIAL_KIT.md").write_text(social, encoding="utf-8")

          citation = dedent(r'''
          cff-version: 1.2.0
          message: "If you use T-Trace or OpenPoC in research or engineering work, please cite this repository."
          title: "T-Trace: AI Agent Action Receipts and Assurance-Boundary Verification"
          type: software
          authors:
            - family-names: "Safonov"
              given-names: "Aleksei"
          repository-code: "https://github.com/safal207/T-Trace"
          url: "https://github.com/safal207/T-Trace"
          license: "MIT"
          keywords:
            - AI agent verification
            - action receipts
            - deterministic replay
            - causal traces
            - assurance boundaries
            - interoperability
          ''').strip() + "\n"
          Path("CITATION.cff").write_text(citation, encoding="utf-8")
          PY

          rm -f .github/seo-smm-refresh.trigger
          rm -f .github/workflows/seo-smm-refresh-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: improve T-Trace SEO and social discovery"
          git push
