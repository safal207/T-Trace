name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  independent-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned first-verifier dependencies
        run: python -m pip install 'cryptography==46.0.4' 'cffi==2.1.1' 'pycparser==3.0'
      - name: Test the standalone Node implementation
        run: node --test verifiers/node/artifact-handoff.test.mjs
      - name: Compare every full report with isolated Node execution
        run: python scripts/compare_handoff_implementations.py
      - name: Check fixed-input measurement plumbing without absolute speed assertions
        run: python scripts/benchmark_artifact_handoff.py smoke /tmp/ttrace-handoff-benchmark-smoke

  installed-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Acquire pinned receipt dependencies and build wheel
        run: |
          python -m pip download --only-binary=:all: --dest dist/offline \
            'cryptography==46.0.4' 'cffi==2.1.1' 'pycparser==3.0'
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify handoff corpus from an offline installed environment
        run: python scripts/verify_installed_handoff.py dist/t_trace-0.1.0-py3-none-any.whl dist/offline

  installed-verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel outside the source checkout
        run: python scripts/verify_installed_verifiers.py dist/t_trace-0.1.0-py3-none-any.whl

  validate-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical example
        run: |
          python scripts/validate_ttrace.py examples/minimal.ttrace.jsonl
      - name: Verify bounded cross-source snapshots
        run: |
          python -m openpoc.verify_cross_source examples/openpoc-03/counterpart-omission.scenario.json
          python -m openpoc.verify_cross_source examples/openpoc-03/nonfinal-snapshots.scenario.json
          python -m openpoc.verify_cross_source examples/openpoc-03/delayed-observation.scenario.json
      - name: Verify portable causality example
        run: |
          python scripts/verify_portable_causality.py \
            examples/causal-portability/fork-reconciliation.json
      - name: Verify repeated lineage compaction
        run: |
          python scripts/verify_lineage_compaction.py
      - name: Verify selective lineage disclosure
        run: |
          python scripts/verify_lineage_membership.py
      - name: Verify membership-root consistency
        run: |
          python scripts/verify_lineage_consistency.py
      - name: Verify witness-quorum anti-equivocation
        run: |
          python scripts/verify_lineage_witness_quorum.py
      - name: Verify witness-policy handoff
        run: |
          python scripts/verify_witness_policy_handoff.py
      - name: Verify repeated witness-policy handoff chain
        run: |
          python scripts/verify_witness_policy_handoff_chain.py
      - name: Verify witness-policy handoff-chain selective disclosure
        run: |
          python scripts/verify_witness_policy_handoff_chain_membership.py
      - name: Verify witness-policy handoff membership-root consistency
        run: |
          python scripts/verify_witness_policy_handoff_chain_consistency.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: |
          python -m pytest
      - name: Check the frozen artifact-handoff decision corpus
        run: python -m openpoc.artifact_handoff_corpus verify examples/artifact-handoff-v0.1
      - name: Exercise an actual controlled artifact handoff
        run: python -m openpoc.artifact_handoff_demo /tmp/ttrace-controlled-handoff
