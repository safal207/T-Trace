name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical example
        run: |
          python scripts/validate_ttrace.py examples/minimal.ttrace.jsonl
      - name: Verify portable causality example
        run: |
          python scripts/verify_portable_causality.py \
            examples/causal-portability/fork-reconciliation.json
      - name: Verify repeated lineage compaction
        run: |
          python scripts/verify_lineage_compaction.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: |
          python -m pytest
