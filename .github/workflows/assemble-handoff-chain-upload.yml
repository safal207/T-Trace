name: Assemble Repeated Handoff Chain Upload

on:
  push:
    branches:
      - feat/repeated-witness-policy-handoff-chain-v0-1
    paths:
      - .handoff-chain-upload/**
      - .github/workflows/assemble-handoff-chain-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate exact payload
        run: |
          set -euo pipefail
          if [ ! -f .handoff-chain-upload/part-000 ]; then
            echo "handoff_chain_payload=ALREADY_ASSEMBLED"
            exit 0
          fi
          cat .handoff-chain-upload/part-* > /tmp/handoff-chain-payload.b64
          base64 --decode /tmp/handoff-chain-payload.b64 > /tmp/handoff-chain-payload.tar.gz
          echo "ec2a61235ebb89654d7efd5eab9a6b03ea5c70a314b274ff68b94ed21ead141b  /tmp/handoff-chain-payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/handoff-chain-payload.tar.gz -C .
          git checkout -- .github/workflows/ci.yml
          python -m py_compile \
            ttrace/lineage_witness_handoff_chain.py \
            scripts/verify_witness_policy_handoff_chain.py \
            tests/test_lineage_witness_handoff_chain.py
          rm -rf .handoff-chain-upload

      - name: Commit product source
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "handoff_chain_commit=NO_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(protocol): add repeated witness-policy handoff chain v0.1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
