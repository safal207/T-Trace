name: Handoff publish verified Windows evidence

on:
  push:
    branches: [feat/handoff-measurement-baseline-v0-1]
    paths: [.github/workflows/handoff-benchmark-refresh.yml]

permissions:
  contents: write
  actions: read

jobs:
  preserve-verified-evidence:
    if: github.repository == 'safal207/T-Trace'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: handoff-windows-9e24fcbc93343c8c460e21f729dc979cc23d740e
          run-id: 34134175179
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-evidence
      - name: Install verifier and test dependencies
        run: python -m pip install -e . 'pytest==8.4.2' 'cryptography==46.0.4' 'cffi==2.1.1' 'pycparser==3.0'
      - name: Verify original bytes, complete test evidence and current source identity
        shell: python
        run: |
          import hashlib, json, shutil, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.benchmark_artifact_handoff import validate_report, render_markdown
          source = Path('downloaded-evidence')
          raw = (source / 'baseline/report.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'a85bd4c7d889dcca2417390b5685784d313cdd69fd578827daeeb16e43ae8fa6'
          report = json.loads(raw)
          assert report['repository_base_commit'] == '9e24fcbc93343c8c460e21f729dc979cc23d740e'
          assert report['environment']['os'] == 'Windows'
          validate_report(report, check_sources=True)
          assert render_markdown(report).encode('utf-8') == (source / 'baseline/report.md').read_bytes()
          for name, count in [('full-suite.xml', 695), ('instrumentation-tests.xml', 110)]:
              suites = list(ET.parse(source / name).getroot().iter('testsuite'))
              assert sum(int(item.attrib['tests']) for item in suites) == count
              assert all(int(item.attrib[key]) == 0 for item in suites for key in ('failures', 'errors', 'skipped'))
          output = Path('docs/benchmarks/artifact-handoff-v0.1/windows')
          for name in ('report.json', 'report.md'):
              shutil.copyfile(source / 'baseline' / name, output / name)
          Path('publish-evidence').mkdir()
      - name: Test unchanged validation against the transferred baseline
        run: python -m pytest --junitxml=publish-evidence/full-suite.xml
      - name: Commit only the two verified reports without force or merge
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import base64, hashlib, json, os, subprocess, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.benchmark_artifact_handoff import validate_report
          repo = 'safal207/T-Trace'
          branch = 'feat/handoff-measurement-baseline-v0-1'
          parent = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == repo and os.environ['GITHUB_REF_NAME'] == branch
          def api(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint, data=data, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          source_run = api('GET', '/actions/runs/34134175179')
          assert source_run['conclusion'] == 'success'
          assert source_run['head_sha'] == '9e24fcbc93343c8c460e21f729dc979cc23d740e'
          assert api('GET', '/git/ref/heads/' + branch)['object']['sha'] == parent, 'branch moved; do not overwrite newer work'
          prefix = 'docs/benchmarks/artifact-handoff-v0.1/windows/'
          expected = {'report.json': '3df9a6bf10b89a3906d5f8d291ea6055ea230580',
                      'report.md': 'bc855b6801e72b9874b2ebfa26a279b8b154934d'}
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == {prefix + name for name in expected}
          validate_report(json.loads(Path(prefix + 'report.json').read_bytes()), check_sources=True)
          entries = []
          for name, blob_sha in expected.items():
              raw = Path(prefix + name).read_bytes()
              assert raw == Path('downloaded-evidence/baseline/' + name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest() == blob_sha
              blob = api('POST', '/git/blobs', {'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'})
              assert blob['sha'] == blob_sha
              entries.append({'path': prefix + name, 'mode': '100644', 'type': 'blob', 'sha': blob_sha})
          base = api('GET', '/git/commits/' + parent)
          tree = api('POST', '/git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'docs(handoff): preserve verified Windows baseline from run 34134175179',
              'tree': tree['sha'], 'parents': [parent],
              'author': {'name': 'github-actions[bot]', 'email': '41898282+github-actions[bot]@users.noreply.github.com'}})
          # A concurrent newer commit makes this non-fast-forward update fail.
          result = api('PATCH', '/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False})
          assert result['object']['sha'] == commit['sha']
          evidence = {'published_commit': commit['sha'], 'parent': parent, 'branch': branch,
                      'source_run': 34134175179, 'source_head': source_run['head_sha'], 'blobs': expected,
                      'report_sha256': 'a85bd4c7d889dcca2417390b5685784d313cdd69fd578827daeeb16e43ae8fa6',
                      'merge_performed': False}
          Path('publish-evidence/result.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, sort_keys=True))
      - name: Preserve transfer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: handoff-publish-${{ github.sha }}
          path: publish-evidence/
          if-no-files-found: error
          retention-days: 14
