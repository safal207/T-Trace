name: OpenAI Math 156 bounded proof pilot

on:
  pull_request:
    paths:
      - .github/workflows/math-pilot-156.yml
      - scripts/run_math_pilot_156.sh
      - scripts/math_pilot_no_unix.c
      - scripts/prepare_math_pilot.py
      - scripts/create_math_pilot_manifest.py
      - openpoc/math_pilot.py
      - tests/test_math_pilot*.py
      - examples/math-pilot-156/**
      - docs/math-pilot-156*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator-selected-theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the reviewed head without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare trusted runtime and run the real sandboxed Comparator
        shell: bash
        run: bash scripts/run_math_pilot_156.sh "$RUNNER_TEMP/math-pilot-156"

      - name: Preserve actual evidence even when the check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-pilot-156-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/math-pilot-156/evidence
          if-no-files-found: warn
          retention-days: 30
