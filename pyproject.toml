[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t-trace"
version = "0.1.0"
description = "Reference validators and profiles for the T-Trace protocol"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "T-Trace Contributors" }
]
keywords = ["trace", "jsonl", "protocol", "audit", "continuity", "causality"]

[project.scripts]
ttrace-validate = "ttrace.validation:main"
ttrace-assurance = "openpoc.verify_assurance:main"
ttrace-reproducibility = "openpoc.verify_reproducibility:main"
ttrace-cross-source = "openpoc.verify_cross_source:main"

[project.optional-dependencies]
receipts = ["cryptography>=43.0"]
dev = [
  "pytest>=8.0",
  "cryptography>=43.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["openpoc*", "ttrace*"]
